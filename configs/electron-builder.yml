appId: vestige.lixue
productName: Vestige
directories:
  buildResources: resources
  output: dist/release
files:
  - dist/**/*
  - resources/logos/**/*
  - '!dist/release/**/*'
  - '!dist/types/**/*'
  - '!dist/*.tsbuildinfo'
  - '!dist/.eslintcache'
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - 'ffmpeg/**/*'
      - 'aria2/**/*'
  - from: resources/docs
    to: docs
    filter:
      - 'README.*.md'
      - 'params.*.md'
win:
  executableName: vestige
  icon: resources/logos/logo-square-black.ico
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: resources/logos/logo-square.icns
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - dmg
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  icon: resources/logos/logo-square-black.png
  target:
    - AppImage
  category: Utility
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}