appId: vestige.lixue
productName: Vestige
toolsets:
  # Embed the static runtime so users do not need libfuse2.
  appimage: '1.0.3'
directories:
  buildResources: resources
  output: dist/release
files:
  - dist/**/*
  - resources/logos/**/*
  - '!dist/release/**/*'
  - '!dist/types/**/*'
  - '!dist/*.tsbuildinfo'
  - '!dist/.eslintcache'
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - 'ffmpeg/**/*'
      - 'aria2/**/*'
      - 'vad/**/*'
  - from: resources/docs
    to: docs
    filter:
      - 'README.*.md'
      - 'params.*.md'
win:
  executableName: vestige
  icon: resources/logos/logo-square-black.ico
  target:
    - dir
mac:
  icon: resources/logos/logo-square.icns
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - dmg
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  icon: resources/logos/logo-square-black.png
  target:
    - AppImage
  category: Utility
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}